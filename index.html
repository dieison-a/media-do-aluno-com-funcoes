<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Média do aluno</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <main class="card">
        <h1>Notas do aluno</h1>

        <form action="main.php" method="post">
            <label for="primeiraNota">Primeira nota:</label>
            <input type="number" name="primeiraNota" id="primeiraNota" min="0" max="10" step="0.1" required />

            <label for="segundaNota">Segunda nota:</label>
            <input type="number" name="segundaNota" id="segundaNota" min="0" max="10" step="0.1" required />

            <button type="submit">Calcular média</button>
            <button type="reset">Limpar</button>
        </form>
    </main>
</body>

</html>
